<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Menu </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa-login">
        <h2> Configurções</h2>
        <p style="text-align: center; margin-bottom: 20px;"> Ajuste de Acessibilidade </p>
        
        <button type="button" class="btn-menu" onclick="alternarModoEscuro()"> Alternar p/ Modo escuro</button>
        <button type="button" class="btn-menu" onclick="alternarFonteGrande()"> Alternar p/ Fonte grande </button>

        <a href="menu.html" class="link-esqueci" style="text-align: center; margin-top: 20px;"> Voltar ao menu </a>
    </div>
       <script> 
        function alternarModoEscuro(){
            document.body.classList.toggle('modo-escuro');
        }
        function alternarFonteGrande(){
            document.body.classList.toggle('fonte-grande');
        }
    </script>
</body>
</html>
